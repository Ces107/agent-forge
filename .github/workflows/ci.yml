name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-ledger:
    name: Verify inner project (ledger)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspaces/ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests + coverage gate (>=80%)
        run: python -m pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy --strict)
        run: mypy
      - name: Security (bandit)
        run: bandit -r src -c pyproject.toml

  provenance:
    name: Provenance audit (agent authorship)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit commit provenance
        run: python hooks/audit_provenance.py
