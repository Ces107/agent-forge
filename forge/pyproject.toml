[project]
name = "agent-forge"
version = "0.2.0"
description = "The reusable, observable, falsifiable multi-agent SDLC pipeline (meta-layer)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=forge --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.bandit]
exclude_dirs = ["tests"]
